<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' stroke='%23000000' fill='none' stroke-width='2'/></svg>">
  <title>Sign Up | Finn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      opacity: 0;
      animation: pageLoad 0.6s ease forwards;
    }
    @keyframes pageLoad {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .container {
      width: 100%;
      max-width: 430px;
      margin: 2vh auto;
      padding: 1.5rem;
      text-align: center;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .step2-active .container {
      max-width: 480px !important;
      height: auto !important;
      min-height: 650px !important; /* Augmenté pour la checklist */
      padding: 1.5rem !important;
    }
    .back-link {
      align-self: flex-start;
    }
    .step1 .back-link,
    .step2 .back-link {
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .back-link a {
      color: black;
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-link a::before {
      content: '←';
      font-size: 1.2rem;
    }
    .separator {
      width: 100%;
      height: 1px;
      background-color: #e0e0e0;
      margin: 1rem 0 !important;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .step1 .logo-container {
      margin-bottom: 2rem;
    }
    .step2 .logo-container {
      margin-bottom: 1rem;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 0.5rem;
    }
    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: black;
    }
    .step1, .step2 {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .step1 .input-group,
    .step2 .input-group {
      display: flex;
      flex-direction: column;
    }
    .step1 .input-group {
      gap: 1rem;
      margin-top: 4rem;
    }
    .step2 .input-group {
      gap: 0.8rem;
    }
    .step1 .input-label,
    .step2 .input-label {
      align-self: flex-start;
      font-weight: 500;
    }
    .step1 .input-label {
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .step2 .input-label {
      font-size: 0.9rem;
      margin-bottom: 0.1rem;
    }
    .step1 input,
    .step2 input {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      transition: border-color 0.3s;
    }
    .step1 input {
      padding: 1rem;
      font-size: 1rem;
      height: 55px;
    }
    .step2 input {
      padding: 0.8rem;
      font-size: 0.9rem;
      height: 45px;
    }
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
    }
    .step1 .btn,
    .step2 .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .step1 .btn {
      padding: 1rem;
      font-size: 1rem;
      height: 55px;
      margin-top: 1rem;
    }
    .step2 .btn {
      padding: 0.8rem;
      font-size: 0.9rem;
      height: 45px;
      margin-top: 1rem;
    }
    .btn-submit-email {
      background-color: black;
      color: white;
    }
    .btn-google {
      background-color: #f0f0f0;
      color: black;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google img {
      width: 20px;
    }
    .bottom-text {
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .bottom-text a {
      color: black;
      text-decoration: underline;
    }
    .step1 .error,
    .step2 .error {
      color: #d00;
    }
    .step1 .error {
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }
    .step2 .error {
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }
    .password-checklist {
      text-align: left;
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.5rem;
    }
    .password-checklist ul {
      list-style: none;
      padding-left: 0;
    }
    .password-checklist li {
      display: flex;
      align-items: center;
      margin-bottom: 0.3rem;
    }
    .password-checklist li::before {
      content: '✗';
      color: #d00;
      margin-right: 0.5rem;
    }
    .password-checklist li.valid::before {
      content: '✓';
      color: #0a0;
    }
    @media (max-width: 500px) {
      body {
        background-color: white;
      }
      .container {
        max-width: 100%;
        height: auto;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-shadow: none;
        border-radius: 0;
      }
      .step2-active .container {
        max-width: 100% !important;
        min-height: 100vh !important;
        padding: 1.5rem !important;
      }
      .logo {
        width: 50px;
        height: 50px;
      }
      .brand-name {
        font-size: 1.8rem;
      }
      .step1 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 70vh;
      }
      .step1 .input-group {
        margin-top: 0;
        gap: 1.2rem;
      }
      .step1 .logo-container {
        margin-bottom: 3rem;
      }
      .separator {
        display: none !important;
      }
      .step2-active .separator {
        display: block !important;
        margin: 1rem 0 !important;
      }
      .step1 input {
        padding: 0.8rem;
        height: 50px;
      }
      .bottom-text {
        margin-top: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="black" fill="none" stroke-width="2"/>
      </svg>
      <span class="brand-name">Finn</span>
    </div>

    <div class="back-link" id="backLink" style="display: none;">
      <a href="#" id="backToStep1">Back</a>
    </div>
    <div class="separator" id="separator" style="display: none;"></div>

    <div class="step1">
      <div class="input-group">
        <label class="input-label" for="emailInput">Email</label>
        <input
          type="email"
          id="emailInput"
          name="email"
          placeholder="Enter your email"
          required
        />
        <div class="error" id="emailError"></div>
        <button class="btn btn-submit-email" id="btnSubmitEmail">Submit</button>
        <button class="btn btn-google" id="btnGoogle">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
          Sign up with Google
        </button>
      </div>

      <div class="bottom-text">
        Already have an account? <a href="/connexion">Sign in</a>
        <p>By continuing, you agree to Finn's <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</p>
      </div>
    </div>

    <div class="step2" id="step2" style="display: none;">
      <div class="input-group">
        <label class="input-label" for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" required />

        <label class="input-label" for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" required />

        <label class="input-label" for="emailStep2">Email</label>
        <input type="email" id="emailStep2" name="emailStep2" readonly />

        <label class="input-label" for="password">Password</label>
        <div class="password-container">
          <input
            type="password"
            id="password"
            name="password"
            required
          />
          <span class="password-toggle" id="passwordToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </span>
        </div>
        <div class="password-checklist" id="passwordChecklist">
          <ul>
            <li id="minLength">At least 8 characters</li>
            <li id="uppercase">One uppercase letter</li>
            <li id="lowercase">One lowercase letter</li>
            <li id="digit">One digit</li>
            <li id="symbol">One symbol (!@#$%^&*)</li>
            <li id="noName">No first or last name</li>
          </ul>
        </div>

        <label class="input-label" for="confirmPassword">Confirm password</label>
        <div class="password-container">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
          />
          <span class="password-toggle" id="confirmPasswordToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </span>
        </div>

        <div class="error" id="errorMsg"></div>
        <button class="btn btn-submit-email" id="btnSignupFinal">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btnSubmitEmail = document.getElementById("btnSubmitEmail");
      const step1 = document.querySelector(".step1");
      const step2 = document.getElementById("step2");
      const emailInput = document.getElementById("emailInput");
      const emailStep2 = document.getElementById("emailStep2");
      const btnSignupFinal = document.getElementById("btnSignupFinal");
      const errorMsg = document.getElementById("errorMsg");
      const emailError = document.getElementById("emailError");
      const btnGoogle = document.getElementById("btnGoogle");
      const backLink = document.getElementById("backLink");
      const separator = document.getElementById("separator");
      const backToStep1 = document.getElementById("backToStep1");
      const container = document.querySelector(".container");

      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const passwordToggle = document.getElementById("passwordToggle");
      const confirmPasswordToggle = document.getElementById("confirmPasswordToggle");

      const checklist = {
        minLength: document.getElementById("minLength"),
        uppercase: document.getElementById("uppercase"),
        lowercase: document.getElementById("lowercase"),
        digit: document.getElementById("digit"),
        symbol: document.getElementById("symbol"),
        noName: document.getElementById("noName")
      };

      function togglePasswordVisibility(input, toggleElement) {
        if (input.type === "password") {
          input.type = "text";
          toggleElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          `;
        } else {
          input.type = "password";
          toggleElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          `;
        }
      }

      passwordToggle.addEventListener("click", () => {
        togglePasswordVisibility(passwordInput, passwordToggle);
      });

      confirmPasswordToggle.addEventListener("click", () => {
        togglePasswordVisibility(confirmPasswordInput, confirmPasswordToggle);
      });

      btnSubmitEmail.addEventListener("click", async () => {
        const emailValue = emailInput.value.trim();
        if (!validateEmail(emailValue)) {
          emailError.textContent = "Please enter a valid email address.";
          return;
        }

        try {
          const response = await fetch("/check-email", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email: emailValue }),
          });
          const data = await response.json();

          if (!response.ok) {
            emailError.textContent = data.message;
            return;
          }

          emailError.textContent = "";
          step1.style.display = "none";
          step2.style.display = "flex";
          backLink.style.display = "block";
          separator.style.display = "block";
          emailStep2.value = emailValue;
          document.body.classList.add("step2-active");
          container.classList.add("step2-active");
          separator.style.display = "block";
          separator.style.visibility = "visible";
          separator.style.opacity = "1";
        } catch (err) {
          emailError.textContent = "Server error. Please try again.";
        }
      });

      backToStep1.addEventListener("click", () => {
        step1.style.display = "flex";
        step2.style.display = "none";
        backLink.style.display = "none";
        separator.style.display = "none";
        document.body.classList.remove("step2-active");
        container.classList.remove("step2-active");
      });

      function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(email).toLowerCase());
      }

      function updatePasswordChecklist(password, firstName, lastName) {
        const minLength = /.{8,}/.test(password);
        const uppercase = /[A-Z]/.test(password);
        const lowercase = /[a-z]/.test(password);
        const digit = /\d/.test(password);
        const symbol = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        const noName = !password.toLowerCase().includes(firstName.toLowerCase()) && 
                       !password.toLowerCase().includes(lastName.toLowerCase());

        checklist.minLength.classList.toggle("valid", minLength);
        checklist.uppercase.classList.toggle("valid", uppercase);
        checklist.lowercase.classList.toggle("valid", lowercase);
        checklist.digit.classList.toggle("valid", digit);
        checklist.symbol.classList.toggle("valid", symbol);
        checklist.noName.classList.toggle("valid", noName);

        return minLength && uppercase && lowercase && digit && symbol && noName;
      }

      passwordInput.addEventListener("input", () => {
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        updatePasswordChecklist(passwordInput.value, firstName, lastName);
      });

      btnSignupFinal.addEventListener("click", async () => {
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const email = emailStep2.value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!firstName || !lastName || !email || !password || !confirmPassword) {
          errorMsg.textContent = "All fields are required.";
          return;
        }

        const isPasswordValid = updatePasswordChecklist(password, firstName, lastName);
        if (!isPasswordValid) {
          errorMsg.textContent = "Password does not meet all requirements.";
          return;
        }

        if (password !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match.";
          return;
        }

        try {
          const response = await fetch("/inscription", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              firstName,
              lastName,
              email,
              password,
            }),
          });
          if (response.ok) {
            window.location.href = "/";
          } else {
            const data = await response.json();
            errorMsg.textContent = data.message || "Error during sign up.";
          }
        } catch (err) {
          errorMsg.textContent = "Server error. Please try again.";
        }
      });

      btnGoogle.addEventListener("click", () => {
        window.location.href = "/google_signup";
      });
    });
  </script>

</html>
