<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' stroke='%23000000' fill='none' stroke-width='2'/></svg>">
  <title>Reset Password Error | Finn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      opacity: 0;
      animation: pageLoad 0.6s ease forwards;
    }
    @keyframes pageLoad {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 2vh auto;
      padding: 1.5rem;
      text-align: center;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: auto;
      min-height: 350px; /* Suffisant pour un message d'erreur et un bouton */
      padding-bottom: 1rem;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 0.5rem;
    }
    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: black;
    }
    .error-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
      gap: 1rem;
    }
    .error-message {
      color: #d00;
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      height: 45px;
      margin-top: 1.5rem;
      background-color: black;
      color: white;
    }
    .bottom-text {
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
      margin-bottom: 1rem;
      text-align: center;
    }
    .bottom-text a {
      color: black;
      text-decoration: underline;
    }
    /* Responsive */
    @media (max-width: 500px) {
      body {
        background-color: white;
      }
      .container {
        max-width: 100%;
        height: 100dvh;
        margin: 0;
        padding: 1rem;
        box-shadow: none;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.5rem;
        overflow: hidden;
      }
      .logo {
        width: 50px;
        height: 50px;
      }
      .brand-name {
        font-size: 1.8rem;
      }
      .logo-container {
        margin-bottom: 1rem;
      }
      .error-message {
        font-size: 1rem;
      }
      .btn {
        margin-top: 1rem;
      }
      .bottom-text {
        margin-top: 1.5rem;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo + Finn -->
    <div class="logo-container">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="black" fill="none" stroke-width="2"/>
      </svg>
      <span class="brand-name">Finn</span>
    </div>

    <!-- Error Content -->
    <div class="error-content">
      <div class="error-message">This reset link is invalid or has expired.</div>
      <button class="btn" onclick="window.location.href='/reset-password'">Try Again</button>
    </div>

    <div class="bottom-text">
      Back to <a href="/connexion">Sign in</a>
      <p>By continuing, you agree to Finn's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>
</body>
</html>
