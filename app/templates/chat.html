{% extends 'base.html' %}

{% block content %}
<div class="chat-container" data-conversation-id="{{ conversation_id if conversation_id else '' }}">
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <div class="logo">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Finn 2.1 Prime</h1>
            <h2>Financial Assistant</h2>
            <p>Ask me anything about finance and more!</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <!-- Messages will be dynamically inserted here -->
    </div>

    <div class="chat-input-container">
        <form id="chatForm" class="chat-form">
            <div class="input-wrapper">
                <textarea id="messageInput" class="chat-input" placeholder="Ask a question" rows="1"></textarea>
                <button type="submit" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
        <div class="disclaimer">
            <p>Finn may make mistakes. Consider checking important information.</p>
        </div>
    </div>
</div>

<!-- Templates for messages -->
<template id="userMessageTemplate">
    <div class="message user-message">
        <div class="message-content">
            <p class="message-text"></p>
        </div>
    </div>
</template>

<template id="assistantMessageTemplate">
    <div class="message assistant-message">
        <div class="message-content">
            <p class="message-text"></p>
        </div>
    </div>
</template>

<template id="typingIndicatorTemplate">
    <div class="typing-indicator">
        <div class="typing-animation">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</template>

<style>
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 0;
        background-color: var(--content-bg);
        position: relative;
        overflow: hidden;
    }

    /* Écran de bienvenue */
    .welcome-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        text-align: center;
        padding: 20px;
        min-height: 60vh;
        width: 100%;
        box-sizing: border-box;
    }

    .welcome-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: 400px;
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    
    .welcome-content .logo {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-bottom: 10px;
    }

    .welcome-content .logo svg {
        width: 64px;
        height: 64px;
        color: var(--text-color);
    }

    .welcome-content h1 {
        font-size: 32px;
        font-weight: 600;
        color: var(--text-color);
        margin: 0;
        padding: 0;
        text-align: center;
        width: 100%;
    }

    .welcome-content h2 {
        font-size: 16px;
        font-weight: 400;
        color: var(--text-muted);
        margin: 0;
        padding: 0;
        text-align: center;
        width: 100%;
    }

    .welcome-content p {
        font-size: 16px;
        color: var(--text-color);
        margin: 10px 0 0 0;
        padding: 0;
        text-align: center;
        width: 100%;
    }

    /* Cacher l'écran de bienvenue quand le chat est actif */
    .chat-container.chat-active .welcome-screen {
        display: none;
    }

    /* Zone des messages avec marge fixe et défilement amélioré */
    .chat-messages {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 140px; /* Espace pour la zone de saisie */
        overflow-y: auto;
        padding: 0 20px;
        padding-top: 40px; /* Réduit pour remonter les messages */
        padding-bottom: 20px;
        scrollbar-width: none; /* Firefox */
        z-index: 10;
        scroll-padding-top: 40px; /* Point de départ du scroll */
    }

    /* S'assurer que le défilement ne dépasse pas la marge de 40px en haut */
    .chat-messages::before {
        content: "";
        display: block;
        height: 40px; /* Correspond à padding-top */
        margin-top: -40px;
        visibility: hidden;
    }

    /* Style pour le premier message afin qu'il commence à la bonne position */
    .chat-messages .message:first-child {
        margin-top: 0; /* Pas de marge supplémentaire pour le premier message */
    }

    /* Masquer la barre de défilement */
    .chat-messages::-webkit-scrollbar {
        width: 0;
        background: transparent;
        display: none;
    }

    /* Styles des messages */
    .message {
        display: flex;
        position: relative;
        width: 100%;
        margin-bottom: 20px;
        padding: 0;
    }

    .message-text {
        white-space: pre-wrap;
        word-break: break-word;
        text-align: left;
    }

    .message-content {
        padding: 12px 16px;
        border-radius: 16px;
        word-wrap: break-word;
    }

    /* Messages de l'utilisateur */
    .user-message {
        justify-content: flex-end;
    }

    .user-message .message-content {
        background-color: #f0f0f0;
        color: var(--content-text);
        border-radius: 16px 16px 0 16px;
        max-width: 80%;
        display: inline-block;
        margin-left: auto;
    }

    /* Messages de l'assistant */
    .assistant-message {
        justify-content: flex-start;
        max-width: 100%;
        padding: 0;
    }

    .assistant-message .message-content {
        background-color: transparent;
        color: var(--content-text);
        border-radius: 16px 16px 16px 0;
        width: 100%;
        text-align: left;
        margin: 0;
        padding-left: 0;
        box-sizing: border-box;
    }

    /* Masquer les boutons d'action */
    .edit-message,
    .copy-message {
        display: none !important;
    }

    /* Animation de "en train d'écrire" */
    .typing-indicator {
        align-self: flex-start;
        margin-bottom: 16px;
    }

    .typing-animation {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
    }

    .typing-animation span {
        width: 8px;
        height: 8px;
        background-color: #ccc;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-animation span:nth-child(1) {
        animation-delay: 0s;
    }

    .typing-animation span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-animation span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 100% {
            transform: scale(0.6);
            opacity: 0.5;
        }
        50% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* Zone de saisie du message */
    .chat-input-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px 20px;
        background-color: var(--content-bg);
        z-index: 20;
    }

    .chat-form {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
    }

    .input-wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background-color: #f5f5f5;
        border-radius: 8px;
        padding: 10px 16px;
        min-height: 120px;
        max-height: 120px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid #e0e0e0;
        width: 100%;
        box-sizing: border-box;
        position: relative;
    }

    .chat-input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 8px 0;
        font-size: 14px;
        resize: none;
        max-height: 80px;
        line-height: 1.5;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        overflow-y: auto;
        align-self: flex-start;
    }

    .send-button {
        background-color: #000;
        border: none;
        border-radius: 50%;
        padding: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        position: absolute;
        bottom: 10px;
        right: 16px;
    }

    .send-button svg {
        color: #fff;
    }

    .disclaimer {
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 10px;
    }

    /* Style de l'icône de suppression */
    .delete-conversation {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        opacity: 0.7;
        transition: opacity 0.2s;
    }

    .delete-conversation:hover {
        opacity: 1;
        background: none;
    }

    /* Ajustements pour le responsive */
    @media (max-width: 768px) {
        .chat-container {
            padding: 0;
        }
        
        .welcome-screen {
            padding: 10px;
            min-height: 70vh;
        }

        .welcome-content {
            gap: 12px;
        }

        .welcome-content .logo svg {
            width: 56px;
            height: 56px;
        }

        .welcome-content h1 {
            font-size: 28px;
        }

        .welcome-content h2 {
            font-size: 14px;
        }
        
        .welcome-content p {
            font-size: 14px;
        }

        /* Ajustements pour chat-messages sur mobile */
        .chat-messages {
            bottom: 130px;
            padding-top: 50px; /* Réduit à 50px pour remonter les messages */
            scroll-padding-top: 50px; /* Ajuster le point de départ du scroll */
            margin-top: 50px; /* Réduit à 50px pour aligner avec le menu */
        }
        
        .chat-messages::before {
            height: 50px;
            margin-top: -50px;
        }
        
        .chat-messages .message:first-child {
            margin-top: 0; /* Pas de marge supplémentaire */
        }
        
        .assistant-message .message-content {
            padding-left: 0;
        }
        
        .input-wrapper {
            min-height: 120px !important;
            padding: 8px 12px;
        }
        
        .send-button {
            width: 28px;
            height: 28px;
            padding: 6px;
        }
        
        .chat-input {
            max-height: 70px;
        }
    }

    @media (max-width: 480px) {
        .welcome-screen {
            padding: 5px;
            min-height: 75vh;
        }

        .welcome-content {
            gap: 8px;
        }
        
        .welcome-content .logo svg {
            width: 48px;
            height: 48px;
        }

        .welcome-content h1 {
            font-size: 24px;
        }

        .welcome-content h2 {
            font-size: 12px;
        }
        
        .welcome-content p {
            font-size: 12px;
        }

        /* Ajustements pour les très petits écrans */
        .chat-messages {
            padding-top: 50px; /* Réduit à 50px pour remonter les messages */
            scroll-padding-top: 50px;
            bottom: 110px;
            margin-top: 50px; /* Réduit à 50px pour aligner avec le menu */
        }
        
        .chat-messages::before {
            height: 50px;
            margin-top: -50px;
        }
        
        .chat-messages .message:first-child {
            margin-top: 0;
        }
        
        .message {
            margin-bottom: 12px;
        }
        
        .message-content {
            padding: 8px 12px;
        }

        .chat-input-container {
            padding: 8px;
        }
        
        .input-wrapper {
            min-height: 80px !important;
            max-height: 80px;
            padding: 6px 10px;
        }
        
        .send-button {
            width: 28px;
            height: 28px;
            bottom: 8px;
            right: 12px;
        }
    }

    /* S'assurer que la hauteur prend en compte les barres de navigation */
    @supports (height: 100dvh) {
        .welcome-screen {
            min-height: 60dvh;
        }

        @media (max-width: 768px) {
            .welcome-screen {
                min-height: 70dvh;
            }
        }

        @media (max-width: 480px) {
            .welcome-screen {
                min-height: 75dvh;
            }
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatContainer = document.querySelector('.chat-container');
        const conversationId = chatContainer.dataset.conversationId || '';
        let isScrolling = false;

        // Définir le mode initial (welcome ou chat)
        function setInitialMode() {
            if (conversationId) {
                fetch(`/api/conversations/${conversationId}/messages`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.messages && data.messages.length > 0) {
                            chatContainer.classList.add('chat-active');
                            displayMessages(data.messages);
                        } else {
                            chatContainer.classList.remove('chat-active');
                        }
                    })
                    .catch(error => {
                        console.error('Error loading messages:', error);
                        chatContainer.classList.remove('chat-active');
                    });
            } else {
                chatContainer.classList.remove('chat-active');
            }
        }

        // Fonction pour afficher les messages depuis l'API
        function displayMessages(messages) {
            chatMessages.innerHTML = '';
            messages.forEach(msg => {
                if (msg.role === 'user') {
                    addUserMessage(msg.content);
                } else if (msg.role === 'assistant') {
                    addAssistantMessage(msg.content);
                }
            });
            scrollToBottom();
        }

        // Ajustement automatique de la hauteur du textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            const maxHeight = window.innerWidth <= 480 ? 50 : 120;
            this.style.height = Math.min(this.scrollHeight, maxHeight) + 'px';
        });

        // Fonction pour charger les conversations récentes
        function loadRecentConversations() {
            const recentConversationsContainer = document.getElementById('recentConversations');
            if (!recentConversationsContainer) return;

            fetch('/api/conversations', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des conversations');
                }
                return response.json();
            })
            .then(conversations => {
                recentConversationsContainer.innerHTML = '';
                
                Object.entries(conversations).forEach(([convId, conv]) => {
                    const convElement = document.createElement('div');
                    convElement.className = 'nav-item conversation-item';
                    convElement.dataset.conversationId = convId;
                    
                    const currentConvId = document.querySelector('.chat-container')?.dataset.conversationId;
                    const isActive = currentConvId === convId;
                    
                    convElement.innerHTML = `
                        <a href="/chat/${convId}" class="nav-link conversation-link ${isActive ? 'active' : ''}">
                            <div class="nav-content">
                                <span class="conversation-title">${conv.title}</span>
                            </div>
                            <div class="conversation-actions">
                                <button class="delete-conversation" data-conversation-id="${convId}">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18"></path>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </div>
                        </a>
                    `;
                    
                    recentConversationsContainer.appendChild(convElement);
                    
                    const deleteBtn = convElement.querySelector('.delete-conversation');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            const conversationId = this.dataset.conversationId;
                            window.currentConversationToDelete = conversationId;
                            
                            const modal = document.getElementById('deleteConfirmModal');
                            if (modal) {
                                modal.classList.add('active');
                            }
                        });
                    }
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
            });
        }

        // New Chat button handler
        const newChatBtn = document.getElementById('newChatBtn');
        if (newChatBtn) {
            newChatBtn.addEventListener('click', function() {
                window.location.href = '/chat';
            });
        }

        // Appeler la fonction au chargement de la page
        loadRecentConversations();

        // Soumission du formulaire
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            
            if (message) {
                chatContainer.classList.add('chat-active');
                addUserMessage(message);
                
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                const typingIndicator = addTypingIndicator();
                const currentConversationId = chatContainer.dataset.conversationId || '';
                
                fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        message: message,
                        conversation_id: currentConversationId
                    }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erreur lors de la requête');
                    }
                    return response.json();
                })
                .then(data => {
                    typingIndicator.remove();
                    addAssistantMessage(data.response);
                    
                    if (data.conversation_id && (!currentConversationId || data.conversation_id !== currentConversationId)) {
                        chatContainer.dataset.conversationId = data.conversation_id;
                        if (!currentConversationId) {
                            history.pushState({}, '', `/chat/${data.conversation_id}`);
                        }
                    }
                    
                    loadRecentConversations();
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    typingIndicator.remove();
                    addAssistantMessage("Désolé, je n'ai pas pu traiter votre demande. Veuillez réessayer.");
                });
            }
        });

        // Fonction pour ajouter un message utilisateur
        function addUserMessage(message) {
            const template = document.getElementById('userMessageTemplate');
            const messageElement = template.content.cloneNode(true);

            messageElement.querySelector('.message-text').textContent = message;
            chatMessages.appendChild(messageElement);

            scrollToBottom();
        }

        // Fonction pour ajouter un message assistant
        function addAssistantMessage(message) {
            const template = document.getElementById('assistantMessageTemplate');
            const messageElement = template.content.cloneNode(true);

            messageElement.querySelector('.message-text').textContent = message;
            chatMessages.appendChild(messageElement);

            scrollToBottom();
        }

        // Fonction pour ajouter l'indicateur de saisie
        function addTypingIndicator() {
            const template = document.getElementById('typingIndicatorTemplate');
            const indicator = template.content.cloneNode(true);

            chatMessages.appendChild(indicator);
            scrollToBottom();

            return chatMessages.lastElementChild;
        }

        // Calculer la marge supérieure en fonction de la taille de l'écran
        function getTopMargin() {
            if (window.innerWidth <= 480) {
                return 50; // Très petits écrans
            } else if (window.innerWidth <= 768) {
                return 50; // Tablettes et mobiles moyens
            } else {
                return 40; // Desktop
            }
        }

        // Fonction améliorée pour le défilement
        function scrollToBottom() {
            if (isScrolling) return;
            
            isScrolling = true;
            
            const topMargin = getTopMargin();
            const scrollTarget = chatMessages.scrollHeight - chatMessages.clientHeight;
            
            requestAnimationFrame(() => {
                chatMessages.scrollTop = scrollTarget;
                
                setTimeout(() => {
                    isScrolling = false;
                }, 50);
            });
        }

        // Empêcher le défilement au-delà de la marge supérieure
        chatMessages.addEventListener('scroll', function() {
            const topMargin = getTopMargin();
            
            if (chatMessages.scrollTop < topMargin) {
                chatMessages.scrollTop = topMargin; // Bloquer le défilement au-delà de la marge
            }
        });

        // Observer les nouveaux messages pour maintenir le défilement
        function setupScrollObserver() {
            const observer = new MutationObserver(mutations => {
                let shouldScroll = false;
                
                mutations.forEach(mutation => {
                    if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                        shouldScroll = true;
                    }
                });
                
                if (shouldScroll) {
                    scrollToBottom();
                }
            });
            
            observer.observe(chatMessages, { 
                childList: true,
                subtree: true
            });
            
            return observer;
        }

        // Gérer le défilement lors de l'interaction de l'utilisateur
        chatMessages.addEventListener('scroll', function() {
            const isNearBottom = (chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight) < 100;
            
            if (isNearBottom) {
                scrollToBottom();
            }
        });

        // Assurer que le défilement est maintenu lors du redimensionnement
        window.addEventListener('resize', function() {
            setTimeout(scrollToBottom, 100);
        });

        // Initialiser l'observateur de défilement
        const scrollObserver = setupScrollObserver();

        // Permettre l'envoi avec Entrée, mais Shift+Entrée pour nouvelle ligne
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Observer les changements d'URL pour réinitialiser le mode
        function handleURLChange() {
            if (window.location.pathname === '/chat') {
                chatContainer.dataset.conversationId = '';
                chatContainer.classList.remove('chat-active');
                chatMessages.innerHTML = '';
            }
        }

        window.addEventListener('popstate', handleURLChange);

        // Initialiser le mode au chargement
        setInitialMode();
    });
</script>
{% endblock %}
