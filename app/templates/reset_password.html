<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' stroke='%23000000' fill='none' stroke-width='2'/></svg>">
  <title>Reset Password | Finn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      opacity: 0;
      animation: pageLoad 0.6s ease forwards;
    }
    @keyframes pageLoad {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 2vh auto;
      padding: 1.5rem;
      text-align: center;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: auto;
      min-height: 450px; /* Augmenté pour plus d'espace */
      padding-bottom: 1rem; /* Ajouté pour éviter que le texte en bas ne colle */
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem; /* Augmenté pour plus d'espace sous le logo */
    }
    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 0.5rem;
    }
    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: black;
    }
    .reset-form {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .input-label {
      align-self: flex-start;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.1rem;
    }
    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 0.9rem;
      height: 45px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      height: 45px;
      margin-top: 1.5rem; /* Augmenté pour plus d'espace avant le texte en bas */
      background-color: black;
      color: white;
    }
    .bottom-text {
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
      margin-bottom: 1rem; /* Augmenté pour plus d'espace en bas */
      text-align: center;
    }
    .bottom-text a {
      color: black;
      text-decoration: underline;
    }
    .error {
      color: #d00;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      text-align: left;
    }
    .success {
      color: #008000;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      text-align: center;
    }
    /* Responsive */
    @media (max-width: 500px) {
      body {
        background-color: white;
      }
      .container {
        max-width: 100%;
        height: 100dvh;
        margin: 0;
        padding: 1rem;
        box-shadow: none;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Assure un centrage vertical complet */
        gap: 0.5rem;
        overflow: hidden;
      }
      .logo {
        width: 50px;
        height: 50px;
      }
      .brand-name {
        font-size: 1.8rem;
      }
      .logo-container {
        margin-bottom: 1rem; /* Réduit légèrement sur mobile */
      }
      .input-group {
        gap: 0.8rem;
        margin-top: 0.5rem;
      }
      .btn {
        margin-top: 1rem; /* Réduit légèrement sur mobile pour compacité */
      }
      .bottom-text {
        margin-top: 1.5rem; /* Augmenté pour plus d'espace en bas sur mobile */
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo + Finn -->
    <div class="logo-container">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="black" fill="none" stroke-width="2"/>
      </svg>
      <span class="brand-name">Finn</span>
    </div>

    <!-- Reset Form -->
    <div class="reset-form">
      <div class="input-group">
        <label class="input-label" for="emailInput">Email</label>
        <input
          type="email"
          id="emailInput"
          name="email"
          placeholder="Enter your email"
          required
        />
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <button class="btn" id="btnReset">Send Reset Link</button>
      </div>

      <div class="bottom-text">
        Back to <a href="/connexion">Sign in</a>
        <p>By continuing, you agree to Finn's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btnReset = document.getElementById("btnReset");
      const emailInput = document.getElementById("emailInput");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");

      // Validate email format
      function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(email).toLowerCase());
      }

      // Handle reset form submission
      btnReset.addEventListener("click", async function() {
        const email = emailInput.value.trim();
        errorMsg.textContent = "";
        successMsg.textContent = "";

        // Validate field
        if (!email) {
          errorMsg.textContent = "Email is required.";
          return;
        }

        if (!validateEmail(email)) {
          errorMsg.textContent = "Please enter a valid email address.";
          return;
        }

        try {
          // Send reset request to the server
          const response = await fetch("/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (response.ok) {
            successMsg.textContent = "If an account exists for this email, a reset link has been sent.";
            emailInput.value = ""; // Réinitialiser le champ
          } else {
            errorMsg.textContent = data.message || "An error occurred. Please try again.";
          }
        } catch (err) {
          console.error("Reset error:", err);
          errorMsg.textContent = "Server error. Please try again later.";
        }
      });
    });
  </script>
</body>
</html>
