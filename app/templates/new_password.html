<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' stroke='%23000000' fill='none' stroke-width='2'/></svg>">
  <title>New Password | Finn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      opacity: 0;
      animation: pageLoad 0.6s ease forwards;
    }
    @keyframes pageLoad {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 2vh auto;
      padding: 1.5rem;
      text-align: center;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: auto;
      min-height: 500px; /* Suffisant pour les champs et le bouton */
      padding-bottom: 1rem;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 0.5rem;
    }
    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: black;
    }
    .new-password-form {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .input-label {
      align-self: flex-start;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.1rem;
    }
    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 0.9rem;
      height: 45px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      height: 45px;
      margin-top: 1.5rem;
      background-color: black;
      color: white;
    }
    .bottom-text {
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
      margin-bottom: 1rem;
      text-align: center;
    }
    .bottom-text a {
      color: black;
      text-decoration: underline;
    }
    .error {
      color: #d00;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      text-align: left;
    }
    .success {
      color: #008000;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      text-align: center;
    }
    /* Responsive */
    @media (max-width: 500px) {
    body {
      background-color: white;
    }
    .container {
      max-width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 1rem;
      box-shadow: none;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      overflow: hidden;
    }
    .logo-container {
      margin-bottom: 2rem;
    }
    .reset-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-group {
      width: 80%;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .btn {
      margin-top: 1rem;
    }
    .bottom-text {
      margin-top: auto;
      margin-bottom: 2rem;
      width: 80%;
      text-align: center;
    }
    /* Ajustement pour petite hauteur (optionnel) */
    @media (max-height: 600px) {
      .input-group {
        margin-top: 0.3rem;
        gap: 0.6rem;
      }
      .logo-container {
        margin-bottom: 0.3rem;
      }
      .btn {
        margin-top: 0.3rem;
      }
      .bottom-text {
        margin-top: 0.8rem;
        margin-bottom: 0.3rem;
      }
    }
  }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo + Finn -->
    <div class="logo-container">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="black" fill="none" stroke-width="2"/>
      </svg>
      <span class="brand-name">Finn</span>
    </div>

    <!-- New Password Form -->
    <div class="new-password-form">
      <div class="input-group">
        <label class="input-label" for="newPassword">New Password</label>
        <div class="password-container">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            required
          />
          <span class="password-toggle" id="passwordToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </span>
        </div>

        <label class="input-label" for="confirmPassword">Confirm New Password</label>
        <div class="password-container">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            required
          />
          <span class="password-toggle" id="confirmPasswordToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </span>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <button class="btn" id="btnResetPassword">Reset Password</button>
      </div>

      <div class="bottom-text">
        Back to <a href="/connexion">Sign in</a>
        <p>By continuing, you agree to Finn's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btnResetPassword = document.getElementById("btnResetPassword");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const errorMsg = document.getElementById("errorMsg");
      const passwordToggle = document.getElementById("passwordToggle");
      const confirmPasswordToggle = document.getElementById("confirmPasswordToggle");

      // Toggle password visibility
      function togglePasswordVisibility(input, toggleElement) {
        if (input.type === "password") {
          input.type = "text";
          toggleElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          `;
        } else {
          input.type = "password";
          toggleElement.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          `;
        }
      }

      passwordToggle.addEventListener("click", () => togglePasswordVisibility(newPasswordInput, passwordToggle));
      confirmPasswordToggle.addEventListener("click", () => togglePasswordVisibility(confirmPasswordInput, confirmPasswordToggle));

      // Validate password
      function validatePasswords(newPassword, confirmPassword) {
        if (!newPassword || !confirmPassword) {
          return "All fields are required.";
        }
        if (newPassword.length < 8) {
          return "Password must be at least 8 characters long.";
        }
        if (newPassword !== confirmPassword) {
          return "Passwords do not match.";
        }
        return null; // No error
      }

      // Handle password reset submission
      btnResetPassword.addEventListener("click", async function() {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const token = window.location.pathname.split('/').pop(); // Extract token from URL

        errorMsg.textContent = "";

        const error = validatePasswords(newPassword, confirmPassword);
        if (error) {
          errorMsg.textContent = error;
          return;
        }

        try {
          // Send new password to the server with the token
          const response = await fetch(`/reset-password/${token}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ newPassword }),
          });

          const data = await response.json();

          // Dans le script de new_password.html
          if (response.ok) {
            errorMsg.textContent = "";
            document.getElementById("successMsg") || document.createElement("div"); // Ajouter un élément success si absent
            document.getElementById("successMsg").className = "success";
            document.getElementById("successMsg").textContent = "Password reset successfully!";
            setTimeout(() => {
              window.location.href = "/connexion";
            }, 2000); // Redirection après 2 secondes
          } else {
            errorMsg.textContent = data.message || "An error occurred. Please try again.";
          }
        } catch (err) {
          console.error("Password reset error:", err);
          errorMsg.textContent = "Server error. Please try again later.";
        }
      });
    });
  </script>
</body>
</html>
